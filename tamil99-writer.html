<!DOCTYPE html>
<!-- @version 1.6.3 -->
<html lang="ta">
<head>
<meta charset="UTF-8">
<title>தமிழ் 99</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; padding: 1.5rem; background: #f9f9f9; color: #111; max-width: 640px; }
h1 { font-size: 18px; font-weight: 600; margin-bottom: 0; font-family: 'Noto Sans Tamil', sans-serif; }
.label { font-size: 13px; color: #666; margin-bottom: 5px; font-weight: 500; }
.tamil { font-family: 'Noto Sans Tamil', sans-serif; font-size: 24px; width: 100%;
  padding: 14px 16px; border: 1px solid #ddd; border-radius: 8px;
  background: #fff; color: #111; min-height: 320px; word-break: break-all; line-height: 1.7;
  white-space: pre-wrap; resize: vertical; overflow-y: auto; }
button { padding: 6px 16px; border-radius: 6px; border: 1px solid #ccc;
  background: #fff; cursor: pointer; font-size: 13px; }
button:hover { background: #f0f0f0; }
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 10px; }
.toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.toolbar button { padding: 4px 10px; font-size: 11px; border-radius: 5px;
  border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; color: #555; }
.toolbar button:hover { background: #e8e8e8; }
.font-size-group { display: flex; border: 1px solid #ccc; border-radius: 5px; overflow: hidden; }
.font-size-group button { border: none; border-radius: 0; padding: 4px 9px; }
.font-size-group button.active { background: #4a7fcb; color: #fff; }
.box-wrap { position: relative; }
#box { cursor: text; outline: none; }
#box:focus { border-color: #4a7fcb; }
#btn-copy.copied { color: #4a9e4a; border-color: #4a9e4a; }
#btn-paste.pasted { color: #4a9e4a; border-color: #4a9e4a; }
.hint { font-size: 11px; color: #999; margin-top: 5px; }
.cursor {
  display: inline-block;
  width: 2px;
  height: 1.1em;
  vertical-align: middle;
  background: #4a7fcb;
  margin: 0 -1px;
  animation: blink 1s step-start infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.pending-char { opacity: 0.6; } /* not yet committed — e.g. a bare consonant awaiting a vowel sign */
.meta-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; flex-wrap: wrap; gap: 8px; }
.stats { font-size: 12px; color: #777; }
.save-status { font-size: 11px; color: #999; min-width: 90px; text-align: right; }
.save-status.saved { color: #4a9e4a; }
.save-status.pending { color: #c99a2e; }
</style>
</head>
<body>

<div class="topbar">
  <h1>தமிழ் 99</h1>
  <div class="toolbar">
    <button id="btn-paste" title="Paste text from clipboard">⎗ paste</button>
    <button id="btn-copy" title="Copy typed text">⎘ copy</button>
    <button id="btn-download" title="Download as .txt">⬇ download</button>
    <div class="font-size-group">
      <button data-size="small" title="Small font">A⁻</button>
      <button data-size="medium" title="Medium font">A</button>
      <button data-size="large" title="Large font">A⁺</button>
    </div>
    <button id="btn-reset">↺ Reset</button>
  </div>
</div>

<div class="box-wrap">
  <div class="tamil" id="box" tabindex="0"></div>
</div>
<p class="hint">Click here then type using Tamil 99 keys — or paste text, or press Ctrl+V / Cmd+V</p>

<div class="meta-row">
  <div class="stats" id="stats"></div>
  <span class="save-status" id="save-status"></span>
</div>

<script src="js/tamil99.js"></script>
<script>
const engine = new Tamil99Engine();
engine.setCombine(true); // always combination mode — no toggle

// Text is a plain array of finalized grapheme clusters (visual characters,
// not codepoints or keystrokes), with cursorPos as an index into it — this
// is what lets Left/Right and insert/delete act at an arbitrary position
// instead of always at the end. pendingChar is whatever's mid-composition
// (e.g. a bare consonant waiting for a vowel sign) — conceptually sitting
// exactly at cursorPos, not yet committed into the array.
let chars     = [];
let cursorPos = 0;
let pendingChar = '';

// Deliberate scope limit: typing at a mid-text cursor always starts a FRESH
// composition. Placing the cursor right after an existing bare consonant
// and typing a vowel-sign does NOT resume combining with it — that would
// need "priming" the engine's pending state from surrounding text, which
// adds real complexity/fragility for a fairly narrow use case. Backspace
// still correctly re-exposes a consonant as pending when deleting a
// combined character, same as before, since that's tracked locally, not
// inferred from context.

function resetState() {
  chars = []; cursorPos = 0; pendingChar = '';
  engine.reset();
  clearDraft();
  render();
}

// ── Draft persistence ─────────────────────────────────────────────────────
// Own namespace (eluthu_writer_draft), fully separate from
// eluthu_activity/eluthu_badges/eluthu_lesson_stars — this sandbox is for
// personal writing, not graded practice, and must never cross-read/write
// with the streak/badge/star system.
const DRAFT_KEY = 'eluthu_writer_draft';
let saveTimer = null;

function loadDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null; // graceful degradation — treat as no draft, not an error
  }
}

function saveDraft() {
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      text: getFullText(),
      updated_at: new Date().toISOString(),
    }));
    setSaveStatus('saved');
  } catch {
    setSaveStatus('idle'); // localStorage unavailable — fail silently, not an error to the user
  }
}

function clearDraft() {
  try { localStorage.removeItem(DRAFT_KEY); } catch { /* nothing to clean up if unavailable */ }
  setSaveStatus('idle');
}

// Debounced — saves 1s after the user stops typing, not on every keystroke.
function scheduleSave() {
  setSaveStatus('pending');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDraft, 1000);
}

function setSaveStatus(state) {
  const el = document.getElementById('save-status');
  if (!el) return;
  el.className = 'save-status';
  if (state === 'saved')      { el.textContent = '✓ சேமிக்கப்பட்டது (Saved)'; el.classList.add('saved'); }
  else if (state === 'pending') { el.textContent = '… சேமிக்கிறது (Saving)'; el.classList.add('pending'); }
  else { el.textContent = ''; }
}

// ── Word / character count ───────────────────────────────────────────────
function updateStats() {
  const text = getFullText();
  // Grapheme clusters, matching this app's convention elsewhere (கா counts
  // as 1 character, not 2 codepoints) — chars[] is already exactly that.
  const charCount = chars.length + (pendingChar ? 1 : 0);
  const wordCount = text.trim() ? text.trim().split(/\s+/).filter(Boolean).length : 0;

  const el = document.getElementById('stats');
  if (!el) return;
  el.textContent = `${wordCount} சொற்கள் (words) · ${charCount} எழுத்துக்கள் (characters)`;
}

function getFullText() {
  return chars.slice(0, cursorPos).join('') + pendingChar + chars.slice(cursorPos).join('');
}

function insertAtCursor(str) {
  if (!str) return;
  const segs = [...new Intl.Segmenter().segment(str)].map(s => s.segment);
  chars.splice(cursorPos, 0, ...segs);
  cursorPos += segs.length;
}

// Finalizes any in-progress pendingChar into the committed array — needed
// before cursor movement or paste, since "resume this composition later"
// isn't meaningful once you've moved away from it.
function commitPending() {
  if (pendingChar) {
    chars.splice(cursorPos, 0, pendingChar);
    cursorPos += 1;
    pendingChar = '';
  }
  engine.reset();
}

function applyResult(r) {
  if (!r) return;

  if (r.type === 'consonant_pending') {
    pendingChar = r.output;
    return;
  }

  if (r.type === 'implicit_a') {
    insertAtCursor(r.output);
    pendingChar = '';
    return;
  }

  if (r.replace) {
    if (r.pending) {
      const segs = [...new Intl.Segmenter().segment(r.output)].map(s => s.segment);
      insertAtCursor(segs.slice(0, -1).join(''));
      pendingChar = segs[segs.length - 1];
    } else {
      insertAtCursor(r.output);
      pendingChar = '';
    }
    return;
  }

  if (r.pending && r.type === 'consonant_chain') {
    insertAtCursor(pendingChar);
    pendingChar = r.output;
  } else {
    insertAtCursor(r.output);
    pendingChar = r.pending || '';
  }
}

function handleBackspace() {
  const fakeEvent = { code: 'Backspace', shiftKey: false,
    ctrlKey: false, altKey: false, metaKey: false, key: 'Backspace' };
  const r = engine.processKey(fakeEvent);
  if (!r) return;

  if (r.type === 'backspace_pending') {
    pendingChar = '';
    return;
  }

  if (cursorPos === 0) { pendingChar = ''; return; } // nothing before cursor to delete

  const last = chars[cursorPos - 1];
  const lastCps = [...last];
  const isConsonant = cp => cp >= 0x0B95 && cp <= 0x0BB9;
  const isMarker    = cp => (cp >= 0x0BBE && cp <= 0x0BC8) || cp === 0x0BCD;

  if (lastCps.length >= 2 && isConsonant(lastCps[0].codePointAt(0)) &&
      lastCps.slice(1).every(c => isMarker(c.codePointAt(0)))) {
    // Deleting a combined char (e.g. கா) re-exposes the bare consonant as
    // pending, so the next key can pick a different vowel/pulli for it.
    const consonant = lastCps[0];
    chars.splice(cursorPos - 1, 1);
    cursorPos -= 1;
    engine._pending = consonant;
    pendingChar = consonant;
  } else {
    chars.splice(cursorPos - 1, 1);
    cursorPos -= 1;
    pendingChar = '';
  }
}

function render() {
  const box = document.getElementById('box');
  box.innerHTML = '';
  box.appendChild(document.createTextNode(chars.slice(0, cursorPos).join('')));
  if (pendingChar) {
    const pend = document.createElement('span');
    pend.className = 'pending-char';
    pend.textContent = pendingChar;
    box.appendChild(pend);
  }
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  box.appendChild(cursor);
  box.appendChild(document.createTextNode(chars.slice(cursorPos).join('')));
  updateStats();
}

// Appends clipboard text at the current cursor position (finalizing any
// in-progress composition first, same as arrow-key navigation does).
async function pasteFromClipboard() {
  let text;
  try {
    text = await navigator.clipboard.readText();
  } catch (err) {
    console.error('Clipboard paste failed (browser permission or unsupported):', err);
    return;
  }
  if (!text) return;
  commitPending();
  insertAtCursor(text.trim());
  render();
  scheduleSave();
  document.getElementById('box').focus();
}

document.getElementById('box').addEventListener('keydown', e => {
  if (['Shift','Control','Alt','Meta','CapsLock','Tab','Escape'].includes(e.key)) return;

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
    e.preventDefault();
    pasteFromClipboard();
    return;
  }

  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    commitPending();
    cursorPos = Math.max(0, cursorPos - 1);
    render();
    return;
  }
  if (e.key === 'ArrowRight') {
    e.preventDefault();
    commitPending();
    cursorPos = Math.min(chars.length, cursorPos + 1);
    render();
    return;
  }
  if (e.key === 'Home') {
    e.preventDefault();
    commitPending();
    cursorPos = 0;
    render();
    return;
  }
  if (e.key === 'End') {
    e.preventDefault();
    commitPending();
    cursorPos = chars.length;
    render();
    return;
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    commitPending();
    insertAtCursor('\n');
    render();
    scheduleSave();
    return;
  }

  e.preventDefault();
  if (e.code === 'Backspace') { handleBackspace(); render(); scheduleSave(); return; }
  const result = engine.processKey(e);
  if (!result) return;
  applyResult(result);
  render();
  scheduleSave();
});

document.getElementById('btn-reset').addEventListener('click', resetState);

document.getElementById('box').addEventListener('click', () => document.getElementById('box').focus());

// ── Font size ────────────────────────────────────────────────────────────
// Persisted separately from the draft (own key) — a UI preference, not
// document content, so it doesn't belong in eluthu_writer_draft.
const FONT_SIZE_KEY = 'eluthu_writer_fontsize';
const FONT_SIZES = { small: 18, medium: 24, large: 30 };

function loadFontSize() {
  try {
    const v = localStorage.getItem(FONT_SIZE_KEY);
    return (v && FONT_SIZES[v]) ? v : 'medium';
  } catch {
    return 'medium'; // graceful degradation — just use the default
  }
}

function applyFontSize(size) {
  document.getElementById('box').style.fontSize = FONT_SIZES[size] + 'px';
  document.querySelectorAll('.font-size-group button').forEach(b => {
    b.classList.toggle('active', b.dataset.size === size);
  });
  try { localStorage.setItem(FONT_SIZE_KEY, size); } catch { /* non-critical */ }
}

document.querySelectorAll('.font-size-group button').forEach(b => {
  b.addEventListener('click', () => applyFontSize(b.dataset.size));
});

// Download as .txt
document.getElementById('btn-download').addEventListener('click', () => {
  const text = getFullText().trim();
  if (!text) return;
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `tamil99-writer-${date}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// Paste button
document.getElementById('btn-paste').addEventListener('click', async () => {
  await pasteFromClipboard();
  const btn = document.getElementById('btn-paste');
  btn.textContent = '✓ pasted';
  btn.classList.add('pasted');
  setTimeout(() => { btn.textContent = '⎗ paste'; btn.classList.remove('pasted'); }, 1500);
});

// Copy button
document.getElementById('btn-copy').addEventListener('click', () => {
  const text = getFullText().trim();
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('btn-copy');
    btn.textContent = '✓ copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '⎘ copy'; btn.classList.remove('copied'); }, 1500);
  });
});

// Restore draft on load — survives a hard refresh. Cursor is placed at the
// end of the restored text; this doesn't itself trigger a save (no
// scheduleSave() call here), since nothing actually changed yet.
const _draft = loadDraft();
if (_draft && typeof _draft.text === 'string' && _draft.text) {
  chars = [...new Intl.Segmenter().segment(_draft.text)].map(s => s.segment);
  cursorPos = chars.length;
}

applyFontSize(loadFontSize());
render();
</script>
</body>
</html>
