<!DOCTYPE html>
<!-- @version 1.1.3 -->
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="description" content="எழுது (eluthu) — free Tamil touch typing tutor">

<!-- Social preview (Open Graph: WhatsApp, Facebook, LinkedIn, Discord) -->
  <meta property="og:title" content="எழுது · Learn to type Tamil">
  <meta property="og:description" content="Free Tamil touch typing tutor. Nothing to install.">
  <meta property="og:image" content="https://ennumezuththum.github.io/eluthu/assets/preview.png">
  <meta property="og:url" content="https://ennumezuththum.github.io/eluthu/">
  <meta property="og:type" content="website">

  <!-- Social preview (Twitter/X) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="எழுது · Learn to type Tamil">
  <meta name="twitter:description" content="Free Tamil touch typing tutor. Nothing to install.">
  <meta name="twitter:image" content="https://ennumezuththum.github.io/eluthu/assets/preview.png">
  <title>எழுது · Learn to type Tamil</title>
  <link rel="stylesheet" href="css/style.css?v=1.3.3">

  <script>
    window.ELUTHU_VERSIONS = window.ELUTHU_VERSIONS || {};
    // ── Non-JS files: update manually when file changes ──────────────────
    window.ELUTHU_VERSIONS['index.html']          = '1.1.3';
    window.ELUTHU_VERSIONS['style.css']           = '1.3.3';
    window.ELUTHU_VERSIONS['tamil99-keymap.json'] = '1.0.0';
  </script>
</head>
<body>

<!-- Header -->


<!-- Lesson/Exercise picker overlay -->
<div id="picker-overlay" class="picker-overlay hidden">
  <div class="picker-panel">
    <div class="picker-header">
      <span class="picker-title">விசைநிலை தேர்வு</span>
      <button id="btn-picker-close">✕</button>
    </div>
    <div class="picker-list" id="picker-list"></div>
  </div>
</div>

<!-- Streak heatmap: day-detail popup -->
<div id="day-detail-overlay" class="picker-overlay hidden">
  <div class="picker-panel day-detail-panel">
    <div class="picker-header">
      <span class="picker-title" id="day-detail-date"></span>
      <button id="day-detail-close">✕</button>
    </div>
    <div class="day-detail-body" id="day-detail-body"></div>
  </div>
</div>

<!-- Row 1: Label + Text prompt -->
<div class="row1">
  <div class="lesson-label" id="lesson-label">
    <span id="lesson-name"></span>
    <span class="label-sep">·</span>
    <span id="exercise-name"></span>
  </div>

  <!-- Result banner -->
  <div class="result-banner hidden" id="result-banner">
    <div class="result-message" id="result-message"></div>
    <div class="result-stats" id="result-stats"></div>
  </div>

  <section class="char-row-wrap">
    <div class="char-row" id="char-row"></div>
  </section>
</div>

<!-- Row 2: 3-column layout -->
<div class="row2">

  <!-- Left panel: stats + controls -->
  <div class="panel panel-left">
    <div class="stats-bar" id="stats-bar">
      <div class="stat-item">
        <span class="stat-value" id="stat-cpm">—</span>
        <span class="stat-label">WPM</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="stat-accuracy">—</span>
        <span class="stat-label">துல்லியம்</span>
        <span class="stat-target" id="stat-target"></span>
      </div>
    </div>

    <!-- Practice streak heatmap — click a day for details -->
    <div class="streak-panel" id="streak-panel">
      <div class="heatmap" id="heatmap"></div>
    </div>

    <div class="controls">
    </div>
  </div>

  <!-- Center: keyboard -->
  <div class="panel panel-center">
    <section class="keyboard-wrap">
      <object id="keyboard-obj" data="assets/keyboard.svg" type="image/svg+xml"></object>
    </section>
  </div>

  <!-- Right panel: navigation -->
  <div class="panel panel-right">
    <button class="ctrl-btn" id="btn-back">← முந்தையது</button>
    <button class="ctrl-btn" id="btn-restart">↺ மீண்டும் தொடங்கு</button>
    <button id="btn-picker" class="nav-btn">📚 பாடங்கள்</button>
    <a href="tamil99-tester.html" target="_blank" class="nav-btn">⌨️ சொந்தப் பயிற்சி</a>
    <a href="https://forms.gle/uwwtEWPmU6NVf6QaA" target="_blank" class="nav-btn">📝 கருத்து</a>
    <a href="https://github.com/eNNumEzuththum/eluthu" target="_blank" class="nav-btn">💻 GitHub</a>
  </div>

</div>

<input id="capture" type="text" autocomplete="off"
       autocorrect="off" autocapitalize="off" spellcheck="false"
       style="position:fixed;top:-9999px;left:-9999px;opacity:0;width:0;height:0;border:none;">

<!-- Version bar -->
<div id="version-info" class="version-bar"></div>

<script src="js/tamil99.js"></script>
<script src="js/combination.js"></script>
<script src="js/typing.js"></script>
<script src="js/lessons.js"></script>
<script src="js/app.js"></script>
<script>
  // Load version.js with cache-bust from URL parameter
  (function() {
    var v = new URLSearchParams(window.location.search).get('v') || Date.now();
    var s = document.createElement('script');
    s.src = 'js/version.js?_=' + v;
    document.currentScript.parentNode.insertBefore(s, document.currentScript.nextSibling);
  })();
</script>
</body>
</html>
